<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Omni Studio</title>
  <link rel="icon" href="assets/studio.omni.app.svg">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/omni-redesign.css">
  <link rel="stylesheet" href="css/omni-panels.css">
  <link rel="stylesheet" href="css/image-chat.css">
</head>
<body>

  <header id="topbar">
    <nav class="omni-navigation">
      <button class="icon-btn" id="btnHistory" type="button" aria-label="History" data-i18n-title="history.title" data-i18n-aria="history.title" aria-haspopup="dialog" aria-expanded="false" aria-controls="historyPanel">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11a9 9 0 1 1 2.4 7.1M3 5v6h6m3-4v5l3 2"/></svg>
      </button>
      <button class="icon-btn active" id="chatTab" type="button" aria-current="page" aria-label="Chat" data-i18n-title="tab.text" data-i18n-aria="tab.text">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11.5a7.5 7.5 0 0 1-7.5 7.5H5l1.7-3.1A7.5 7.5 0 1 1 20 11.5Z"/><path d="M9 11.5h7m-7 3h4"/></svg>
      </button>
      <button class="icon-btn" id="btnSettings" type="button" aria-label="Settings" data-i18n-title="action.settings" data-i18n-aria="action.settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="2.5" fill="var(--surface)"/><circle cx="15" cy="17" r="2.5" fill="var(--surface)"/></svg>
      </button>
    </nav>
  </header>

  <div id="serverControlStore" hidden>
    <span id="modelLabel" data-i18n="status.connecting">connecting…</span>
  </div>

  <main id="chatArea" aria-live="polite"></main>

  <section id="composerHost"></section>

  <div id="toastHost" class="toast-host"></div>
  <div id="lightbox" class="lightbox hidden"></div>
  <div id="modalHost"></div>

  <script src="vendor/voice-vad/ort.wasm.min.js"></script>
  <script src="vendor/voice-vad/bundle.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
