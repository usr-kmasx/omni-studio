<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Omni Studio</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%237c6cf6'/%3E%3Cpath d='M8 20c2.5-1 4.5-1 7 0s4.5 1 7 0' stroke='white' stroke-width='2.4' fill='none' stroke-linecap='round'/%3E%3Cpath d='M8 15c3-1.2 5-1.2 8 0s5 1.2 8 0' stroke='white' stroke-width='2.4' fill='none' stroke-linecap='round'/%3E%3Cpath d='M8 10c3-1.2 5-1.2 8 0s5 1.2 8 0' stroke='white' stroke-width='2.4' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header id="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="15" fill="currentColor"/><path d="M8 20c2.5-1 4.5-1 7 0s4.5 1 7 0" fill="none" stroke="var(--surface)" stroke-width="2.4" stroke-linecap="round"/><path d="M8 15c3-1.2 5-1.2 8 0s5 1.2 8 0" fill="none" stroke="var(--surface)" stroke-width="2.4" stroke-linecap="round"/><path d="M8 10c3-1.2 5-1.2 8 0s5 1.2 8 0" fill="none" stroke="var(--surface)" stroke-width="2.4" stroke-linecap="round"/></svg>
      </span>
      <span class="brand-name">Omni Studio</span>
      <span class="brand-sub" id="modelLabel" data-i18n="status.connecting">connecting…</span>
    </div>

    <div class="tabs" id="viewTabs" role="tablist">
      <button class="tab" id="btnHistory" type="button" data-i18n="history.title" aria-haspopup="dialog">History</button>
      <button class="tab active" data-view="text" role="tab" aria-selected="true" data-i18n="tab.text">Chat</button>
    </div>

    <div class="header-right">
      <button class="status-chip" id="statusChip" type="button" title="Server connection status" data-i18n-title="status.readOnly">
        <span class="dot" id="statusDot"></span>
        <span id="statusLabel" data-i18n="status.connecting">connecting…</span>
      </button>
      <button class="icon-btn" id="btnNewChat" title="New conversation" data-i18n-title="action.newChat">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <button class="icon-btn" id="btnSettings" title="Settings" aria-label="Settings" data-i18n-title="action.settings" data-i18n-aria="action.settings">
        <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/><circle cx="8" cy="6" r="2" fill="var(--bg-soft)"/><circle cx="16" cy="12" r="2" fill="var(--bg-soft)"/><circle cx="10" cy="18" r="2" fill="var(--bg-soft)"/></svg>
      </button>
    </div>
  </header>

  <main id="chatArea" aria-live="polite"></main>

  <section id="composerHost"></section>

  <div id="toastHost" class="toast-host"></div>
  <div id="lightbox" class="lightbox hidden"></div>
  <div id="modalHost"></div>

  <script src="vendor/voice-vad/ort.wasm.min.js"></script>
  <script src="vendor/voice-vad/bundle.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
